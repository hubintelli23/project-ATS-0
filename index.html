<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0c1a">
<link rel="icon" href="img/ic_void.webp">
<title>액팅 소울 : 0 — 체험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f0c1a;        /* 공허의 잉크 */
  --iron:#2c2838;       /* 사슬 철 */
  --silver:#c9c5d6;     /* 로고의 은 */
  --bone:#ece8f3;       /* 본문 */
  --void:#8f7bff;       /* 공허 보라 */
  --void-deep:#3b2a7a;
  --ember:#e0533a;      /* 분노 */
  --fear:#8a4fd0;       /* 두려움 */
  --serif:'Nanum Myeongjo','Noto Serif KR','AppleMyungjo',serif;
  --sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#07060c;color:var(--bone);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--void);outline-offset:2px}

#stage{position:relative;height:100dvh;max-width:520px;margin:0 auto;overflow:hidden;background:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0}

/* ── 배경 ───────────────────────── */
#bg{transition:opacity .8s}
.bg-rift{background:
  radial-gradient(120% 55% at 50% 20%,#5a5468 0%,transparent 65%),
  linear-gradient(#34303f 0%,#1d1a26 55%,#0d0c12 100%)}
.bg-ruin{background:radial-gradient(90% 40% at 50% 60%,#4a3530 0%,transparent 70%),linear-gradient(#2e2a34,#18151d 70%)}
.bg-forge{background:
  radial-gradient(60% 35% at 25% 62%,rgba(255,130,50,.5) 0%,transparent 70%),
  radial-gradient(50% 30% at 85% 55%,rgba(210,80,25,.28) 0%,transparent 70%),
  linear-gradient(#21160f 0%,#1a110c 45%,#3a1c0d 70%,#120b08 100%)}
.bg-wall{background:
  radial-gradient(90% 45% at 50% 45%,rgba(224,83,58,.32),transparent 70%),
  linear-gradient(#463837 0%,#2a2124 50%,#161114 100%)}
.bg-forest{background:
  radial-gradient(80% 40% at 50% 45%,rgba(130,155,145,.22),transparent 70%),
  linear-gradient(#1c2422 0%,#121816 55%,#080a09 100%)}
.bg-village{background:
  radial-gradient(80% 40% at 65% 50%,rgba(160,25,35,.42),transparent 70%),
  linear-gradient(#271b20 0%,#160f13 70%)}
.bg-shrine{background:
  radial-gradient(70% 45% at 50% 42%,rgba(143,123,255,.3),transparent 70%),
  linear-gradient(#110e1c 0%,#0a0812 70%,#050409 100%)}
.bg-void{background:radial-gradient(circle at 50% 42%,#1a1236 0%,#06040d 55%,#000 100%)}
.bg-black{background:#000}
#rift{position:absolute;left:0;right:0;top:4%;height:46%;opacity:0;transition:opacity 1.2s;pointer-events:none}
#fxCanvas{pointer-events:none}

/* ── 스프라이트 ─────────────────── */
#sprites{pointer-events:none}
.spr{position:absolute;bottom:22%;height:68%;transform:translateX(-50%);transition:left .5s ease,opacity .45s,filter .3s;opacity:0;filter:brightness(.55) saturate(.8)}
.spr img{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.spr.on{opacity:1}
.spr.talk{filter:none}
.spr.spirit{height:34%;bottom:46%;animation:float 3.6s ease-in-out infinite}
.spr.spirit img{filter:drop-shadow(0 0 18px rgba(170,150,255,.75))}
@keyframes float{50%{transform:translateX(-50%) translateY(-10px)}}

/* ── 대사창 ─────────────────────── */
#box{position:absolute;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));min-height:28%;
  padding:30px 20px 18px;background:linear-gradient(180deg,rgba(18,15,30,.86),rgba(10,8,18,.94));
  border:1px solid rgba(201,197,214,.35);box-shadow:inset 0 0 0 3px rgba(15,12,26,.9),inset 0 0 0 4px rgba(201,197,214,.15),0 12px 40px rgba(0,0,0,.6);
  border-radius:3px}
#name{position:absolute;top:-15px;left:16px;padding:5px 16px 6px;font-family:var(--serif);font-weight:800;font-size:16px;letter-spacing:.04em;
  background:linear-gradient(180deg,#3a3548,#1b1826);border:1px solid rgba(201,197,214,.55);color:var(--silver);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%)}
#name:empty{display:none}
#text{font-family:var(--serif);font-size:17px;line-height:1.85;word-break:keep-all;white-space:pre-wrap;min-height:4em}
#text.narr{color:#cfcadb}
#text.sys{font-family:var(--sans);color:var(--void);text-align:center;letter-spacing:.02em}
#next{position:absolute;right:16px;bottom:10px;width:10px;height:10px;border-right:2px solid var(--silver);border-bottom:2px solid var(--silver);transform:rotate(45deg);opacity:0;animation:blink 1s infinite}
#box.done #next{opacity:1}
@keyframes blink{50%{opacity:.2}}

#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:6px;z-index:20}
.hb{font-size:13px;padding:6px 11px;border:1px solid rgba(201,197,214,.3);background:rgba(15,12,26,.7);border-radius:2px;color:var(--silver)}
.hb.on{border-color:var(--void);color:#fff;background:rgba(59,42,122,.7)}

/* ── 막 제목 카드 ───────────────── */
#card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;opacity:0;pointer-events:none;transition:opacity .9s;z-index:30;text-align:center;padding:24px}
#card.on{opacity:1;pointer-events:auto}
#card .act{font-family:var(--serif);font-size:15px;color:#8d88a0;letter-spacing:.3em;margin-bottom:14px}
#card .ttl{font-family:var(--serif);font-weight:800;font-size:30px;color:var(--silver);letter-spacing:.06em;
  background:linear-gradient(180deg,#f4f2fa 10%,#9d98ad 55%,#e6e2ef 70%,#6e6980);-webkit-background-clip:text;background-clip:text;color:transparent}
#card .rule{width:120px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--void),transparent)}

/* ── 선택지 ─────────────────────── */
#choice{display:none;flex-direction:column;justify-content:center;gap:14px;padding:0 28px;background:rgba(5,4,10,.72);z-index:25}
#choice.on{display:flex}
#choice .q{font-family:var(--serif);font-size:18px;text-align:center;line-height:1.7;margin-bottom:10px;word-break:keep-all}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid rgba(201,197,214,.35);background:rgba(20,17,32,.9);text-align:left;border-radius:2px}
.opt img{width:46px;height:46px;flex:none}
.opt b{display:block;font-family:var(--serif);font-size:18px;color:#fff}
.opt span{font-size:13px;color:#a7a2b8}
.opt:active{border-color:var(--void);background:rgba(59,42,122,.6)}

/* ── 시스템 알림 / 아이템 ───────── */
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-10px);min-width:70%;padding:14px 18px;text-align:center;
  background:rgba(10,8,20,.92);border-top:1px solid var(--void);border-bottom:1px solid var(--void);font-size:14px;line-height:1.7;opacity:0;transition:.4s;z-index:26;pointer-events:none;color:#ddd6ff}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 타이틀 ─────────────────────── */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;background:radial-gradient(circle at 50% 40%,#1c1533 0%,#0b0814 50%,#000 100%)}
#title img{width:96%;max-width:500px;filter:drop-shadow(0 0 40px rgba(143,123,255,.35));animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{filter:drop-shadow(0 0 60px rgba(143,123,255,.55))}}
#title .sub{font-family:var(--serif);color:#9c97ad;font-size:15px;letter-spacing:.2em;margin:-6px 0 46px}
#title .menu{display:flex;flex-direction:column;gap:12px;width:220px}
.tbtn{padding:13px 0;font-family:var(--serif);font-size:17px;font-weight:700;border:1px solid rgba(201,197,214,.4);background:rgba(15,12,26,.6);color:var(--silver);border-radius:2px}
.tbtn:active{background:rgba(59,42,122,.6)}
.tbtn[disabled]{opacity:.35}
#title .ver{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:#6c6780}

/* ── 로그 ───────────────────────── */
#log{display:none;z-index:35;background:rgba(5,4,10,.96);padding:60px 20px 20px;overflow-y:auto}
#log.on{display:block}
#log p{font-family:var(--serif);font-size:15px;line-height:1.75;margin-bottom:12px;color:#cfcadb;word-break:keep-all}
#log p b{display:block;font-size:13px;color:var(--void);font-family:var(--sans)}
#logClose{position:fixed;top:calc(12px + env(safe-area-inset-top))}

/* ── 3D 전투 ───────────────────── */
#act{display:none;z-index:15;touch-action:none}
#act.on{display:block}
#gl{position:absolute;inset:0;width:100%;height:100%}
#vfx{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(40,20,110,.55) 80%,rgba(0,0,0,.85));mix-blend-mode:multiply}
#vfx.on{animation:vfx 1.6s ease-out}
@keyframes vfx{0%{opacity:1;backdrop-filter:grayscale(1) contrast(1.2)}70%{opacity:.8}100%{opacity:0}}
.ab{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));pointer-events:none}
.ab .nm{font-family:var(--serif);font-weight:800;font-size:20px;color:#fff;text-shadow:0 2px 8px #000}
.ab .sb{font-size:12px;color:#c3bdd3;text-shadow:0 1px 4px #000;margin-top:1px}
.bar{position:relative;height:9px;background:rgba(20,17,30,.85);border:1px solid rgba(201,197,214,.35);margin-top:7px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#7a1f2c,#d4475a);transition:width .25s}
.bar .lag{background:#f2e6e9;transition:width .9s .25s}
.bar .jm{position:absolute;top:-2px;bottom:-2px;left:25%;width:2px;background:var(--void);box-shadow:0 0 6px var(--void)}
.ab .hn{font-size:11px;color:#c9c5d6;text-align:right;margin-top:2px;text-shadow:0 1px 3px #000}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;min-height:20px}
.chip{font-size:11.5px;padding:2px 7px;border:1px solid;border-radius:2px;background:rgba(10,8,18,.75)}
.chip.red{border-color:#c2493a;color:#ffb3a5}.chip.vio{border-color:#8a4fd0;color:#dcc2ff}.chip.gry{border-color:#777;color:#ccc}
#acall{position:absolute;left:0;right:0;top:27%;text-align:center;font-family:var(--serif);font-weight:800;font-size:19px;color:#fff;text-shadow:0 0 12px #000,0 0 3px #000;opacity:0;transform:translateY(6px);transition:.15s;pointer-events:none}
#acall.on{opacity:1;transform:none}#acall.org{color:#ffc27a}#acall.red{color:#ff8c8c}#acall.vio{color:#d6c8ff}
.anum{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:800;font-size:24px;color:#fff;text-shadow:0 0 8px #000,0 0 2px #000;pointer-events:none;animation:pop .9s forwards}
.anum.big{font-size:32px;color:#ffe2a8}.anum.me{color:#ff8d7a}.anum.heal{color:#9dffb8}
@keyframes pop{0%{opacity:0;margin-top:0;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-50px;scale:1}}
.pl{position:absolute;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));width:44%;display:flex;gap:9px;align-items:flex-end;pointer-events:none}
.ring{position:relative;width:62px;height:62px;flex:none;border-radius:50%;background:conic-gradient(var(--void) calc(var(--v)*1%),rgba(34,30,48,.9) 0)}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#000;box-shadow:inset 0 0 14px rgba(143,123,255,.5)}
.ring img{position:absolute;inset:6px;width:50px;height:50px;border-radius:50%;object-fit:cover;object-position:50% 6%}
.ring.full{animation:ringpulse 1.2s infinite}
@keyframes ringpulse{50%{box-shadow:0 0 20px var(--void)}}
.pst{flex:1;font-size:11px;color:#d9d4e6;text-shadow:0 1px 3px #000}
.pst .row{display:flex;justify-content:space-between;margin-top:3px}
.pst .bar{height:7px;margin-top:2px}
.pst .hp i{background:linear-gradient(90deg,#2f6f63,#58c6a6)}
.pst .sy i{background:linear-gradient(90deg,#4b2b6a,#c06bff)}
#syncRow.hot .sy i{background:linear-gradient(90deg,#8a2c6a,#ff5dbd)}
#joyZone{position:absolute;left:0;top:22%;width:52%;bottom:96px}
#joyBase{position:absolute;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:1px solid rgba(201,197,214,.35);background:rgba(15,12,26,.35);opacity:0;pointer-events:none}
#joyBase.on{opacity:1}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:rgba(201,197,214,.55);transform:translate(-50%,-50%)}
.joyhint{position:absolute;left:12%;bottom:30%;font-size:12px;color:rgba(201,197,214,.45);pointer-events:none}
.pad{position:absolute;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));width:208px;height:218px}
.pb{position:absolute;border-radius:50%;border:1px solid rgba(201,197,214,.45);background:radial-gradient(circle at 50% 35%,rgba(48,42,66,.92),rgba(16,13,26,.92));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
.pb b{font-family:var(--serif);font-size:14px;line-height:1.1}.pb span{font-size:10px;color:#c9c5d6;min-height:0}
.pb:active{transform:scale(.94);border-color:#fff}
.pb.off{opacity:.38}
#bAtk{right:0;bottom:0;width:86px;height:86px}#bAtk b{font-size:18px}
#bDodge{right:96px;bottom:2px;width:62px;height:62px}
#bParry{right:8px;bottom:96px;width:62px;height:62px;border-color:rgba(255,170,80,.7)}
#bVoid{right:84px;bottom:76px;width:54px;height:54px;border-color:rgba(143,123,255,.75)}
#bVoid.ready{box-shadow:0 0 16px var(--void)}
#bSkill{right:150px;bottom:70px;width:50px;height:50px}
#bSwap{right:70px;bottom:146px;width:50px;height:50px;border-color:rgba(192,107,255,.7)}
#bJudge{left:50%;bottom:calc(250px + env(safe-area-inset-bottom));transform:translateX(-50%);width:auto;padding:12px 26px;border-radius:2px;border:1px solid #fff;background:radial-gradient(circle,#5a42c8,#170f33);font-family:var(--serif);font-weight:800;font-size:18px;display:none;animation:ringpulse 1s infinite}
#bJudge.on{display:block}
#atip{position:absolute;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));display:flex;gap:10px;align-items:flex-start;padding:9px 11px;background:rgba(15,12,26,.9);border:1px solid rgba(143,123,255,.5);border-radius:2px;font-size:13.5px;line-height:1.5;opacity:0;transition:.3s;pointer-events:none}
#atip.on{opacity:1}#atip img{width:34px;height:34px;flex:none;object-fit:cover;object-position:50% 8%;border-radius:50%}#atip b{color:#d8ceff;font-family:var(--serif)}
#atut{position:absolute;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));padding:10px 12px;background:rgba(30,18,10,.9);border:1px solid rgba(255,170,80,.6);font-size:14px;line-height:1.55;display:none;pointer-events:none}
#atut.on{display:block}#atut small{display:block;color:#ffc27a;font-family:var(--serif);font-weight:700;margin-bottom:2px}
.keys{position:absolute;left:12px;right:12px;top:calc(170px + env(safe-area-inset-top));font-size:11px;color:rgba(201,197,214,.55);pointer-events:none;display:none}
@media (hover:hover) and (pointer:fine){.keys{display:block}}
#result{display:none;z-index:28;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);text-align:center;padding:30px}
#result.on{display:flex}
#result h2{font-family:var(--serif);font-size:32px;color:var(--silver);margin-bottom:10px}
#result p{color:#b8b2c8;line-height:1.7;margin-bottom:26px;word-break:keep-all}
/* ── 공허의 눈 ──────────────────── */
#eye{display:flex;align-items:center;justify-content:center;z-index:29;pointer-events:none;opacity:0;background:#000;transition:opacity .4s}
#eye.on{opacity:1;pointer-events:auto}
#eye .orb{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#000 55%,#5a44c8 70%,#c9bfff 74%,transparent 76%);box-shadow:0 0 80px #6d55e6}
#eye.on .orb{animation:orb 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes orb{to{width:150vmax;height:150vmax}}

.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.flash::after{content:"";position:absolute;inset:0;background:#fff;z-index:50;animation:flash .6s forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.beat{animation:beat 1.1s 2}
@keyframes beat{15%{transform:scale(1.025);filter:hue-rotate(20deg) saturate(1.6)}30%{transform:scale(1)}45%{transform:scale(1.02)}}

#end{display:none;z-index:45;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(circle at 50% 40%,#1c1533,#000 70%)}
#end.on{display:flex}
#end img{width:80%;max-width:380px;margin-bottom:10px}
#end h2{font-family:var(--serif);font-size:20px;color:var(--silver);margin-bottom:6px}
#end .nx{font-family:var(--serif);color:#a49fb5;margin-bottom:24px}
#end dl{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:14px;margin-bottom:30px;text-align:left}
#end dt{color:#8d88a0}#end dd{color:#fff}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:700px){#stage{box-shadow:0 0 0 1px #1d1a28,0 0 80px rgba(0,0,0,.8)}}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer bg-black"></div>
  <svg id="rift" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true">
    <defs><filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="tear" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#05030c"/><stop offset=".7" stop-color="#2a1a5c"/><stop offset="1" stop-color="#b9a8ff"/></radialGradient></defs>
    <path id="tearShape" d="M-10 70 L30 78 L52 66 L80 86 L104 74 L128 98 L150 88 L176 112 L200 100 L224 124 L246 110 L272 132 L296 120 L322 146 L346 134 L372 156 L410 150 L410 166 L374 172 L344 158 L318 170 L292 140 L268 152 L242 128 L220 140 L198 116 L172 128 L148 104 L126 112 L102 90 L78 100 L50 80 L28 92 L-10 84Z" fill="#c4b6ff" filter="url(#glow)" opacity=".75"/>
    <path d="M-10 70 L30 78 L52 66 L80 86 L104 74 L128 98 L150 88 L176 112 L200 100 L224 124 L246 110 L272 132 L296 120 L322 146 L346 134 L372 156 L410 150 L410 166 L374 172 L344 158 L318 170 L292 140 L268 152 L242 128 L220 140 L198 116 L172 128 L148 104 L126 112 L102 90 L78 100 L50 80 L28 92 L-10 84Z" fill="url(#tear)" stroke="#e6deff" stroke-width="1.2"/>
  </svg>
  <canvas id="fxCanvas" class="layer"></canvas>
  <div id="sprites" class="layer"></div>

  <div id="vn" class="layer">
    <div id="box" role="button" aria-label="다음 대사">
      <div id="name"></div>
      <div id="text"></div>
      <div id="next"></div>
    </div>
  </div>

  <!-- 3D 전투 -->
  <div id="act" class="layer">
    <canvas id="gl"></canvas>
    <div id="vfx"></div>
    <div class="ab">
      <div class="nm" id="aName"></div><div class="sb" id="aSub"></div>
      <div class="bar"><i class="lag" id="aLag"></i><i id="aHp"></i><span class="jm" id="aJudgeMark"></span></div>
      <div class="hn" id="aNum"></div>
      <div class="chips" id="aChips"></div>
    </div>
    <div id="acall"></div>
    <div id="joyZone"><div id="joyBase"><div id="joyKnob"></div></div><div class="joyhint">여기를 끌어서 이동</div></div>
    <div class="keys">WASD 이동 · J 공격 · K 회피 · L 흘려보내기 · U 공허 · I 스킬 · O 무기 · Space 단죄</div>
    <div class="pl">
      <div class="ring" id="pRing" style="--v:0"><img src="img/eden.webp" alt="이든"></div>

 A(S('센티아','“오랜만이네요, 카르도 어르신. 당신이 수선해준 내 칼날은 테로르와 포비아의 공격을 뚫기에 충분했어요. 하지만… 여전히 작업 방식은 지나치게 고전적이네요.”'),
   S('카르도','“허, 여전히 그 까칠한 주둥아리는 여전하군. 네 주인은 감정이 없는데, 무기라는 녀석이 주인 몫까지 성깔을 부리니 이든이 고생이 많겠어.”'),
   N('카르도의 시선이 이든의 옷자락을 꼭 붙잡고 반쯤 몸을 숨긴 센수스에게 머물렀다.')),
 B(S('센수스','“할아버지! 나 왔어요! 이든님이랑 무서운 괴물도 물리쳤단 말이에요! 그런데… 할아버지, 왜 이렇게 손이 차가워졌어요? 대장간 불은 이렇게 뜨거운데… 왜…….”'),
   N('카르도는 묵묵히 센수스가 잡은 손을 빼냈다.'),
   S('카르도','“이 녀석, 여전하구나. 오느라 고생했다, 센수스.”'),
   S('센티아','“이곳이 이든의 탄생점인가요? 예상보다 훨씬… ‘고전적’이네요.”'),
   S('카르도','“허, 네 녀석이 바로 그 ‘센티아’로군. 소문대로 입에 면도날을 물고 태어났어.”')),
 S('이든','“……이미 제가 다룰 무기는 충분합니다. 어째서 제가 없는 동안에도 이렇게 많은 무기를 벼리신 겁니까?”'),
 S('카르도','“공허의 균열이 마을 어귀까지 내려왔다! 너 혼자 세상 모든 괴물을 잡을 순 없어. 마을 놈들에게도 제 몸 지킬 칼 한 자루는 쥐여줘야 할 것 아니냐!”'),
 S('카르도','“이든, 잘 들어라. 센수스는 네 마음을 울릴 것이고, 센티아는 네 길을 닦을 게다. 저 녀석들을 무기가 아니라 ‘영혼의 조각’으로 여기게 된 순간, 너는 비로소 인간이 되는 게야. 알겠느냐?”'),
 S('이든','“알겠습니다. 몸 조리하십시오, 카르도.”'),
 hide('kardo','sentia','sensus'),
 {end:1}
];

/* ═══════════ 상태 ═══════════ */
let G={i:0,partner:'A',edenName:'대행자',flags:{},losses:0,absorbed:0};
let auto=false, typing=null, advanceResolve=null, logArr=[];

/* ═══════════ 비주얼 노벨 엔진 ═══════════ */
const sprites={};
function setBg(name,opt={}){$('bg').className='layer bg-'+name;FX.set(name);$('rift').style.opacity=opt.rift?1:0}
function showSpr(id,pos){let el=sprites[id];
  if(!el){el=document.createElement('div');el.className='spr'+(SPIRIT[id]?' spirit':'');el.innerHTML=`<img src="${CHAR[id]}" alt="">`;$('sprites').appendChild(el);sprites[id]=el}
  el.style.left=POS[pos||'c']+'%';requestAnimationFrame(()=>el.classList.add('on'))}
function hideSpr(ids){for(const id of ids){const el=sprites[id];if(el)el.classList.remove('on','talk')}}
function hideAll(){for(const id in sprites)sprites[id].classList.remove('on','talk')}
function highlight(who){const id=SPEAKER[who];for(const k in sprites){sprites[k].classList.toggle('talk',k===id)}}

// 간단하고 확실한 타자기
function typeLine(str,cls){const el=$('text');el.className=cls||'';$('box').classList.remove('done');
  if(typing){clearInterval(typing.h)}
  let i=0;el.textContent='';
  return new Promise(res=>{const done=()=>{clearInterval(h);el.textContent=str;$('box').classList.add('done');typing=null;res()};
    const h=setInterval(()=>{i+=1;el.textContent=str.slice(0,i);if(i>=str.length)done()},26);
    typing={h,done}})}
function waitTap(){return new Promise(r=>{advanceResolve=r;if(auto){const len=$('text').textContent.length;setTimeout(()=>{if(advanceResolve===r){advanceResolve=null;r()}},1100+len*35)}})}
function onTap(){SFX.play('ui');if(typing){typing.done();return}if(advanceResolve){const r=advanceResolve;advanceResolve=null;r()}}
$('box').addEventListener('click',onTap);
$('vn').addEventListener('click',e=>{if(e.target===$('vn'))onTap()});
addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&$('vn').style.display!=='none'&&!$('act').classList.contains('on')&&!$('title').style.display.includes('flex')){e.preventDefault();onTap()}});

async function say(name,text,kind){
  $('vn').style.display='block';
  $('name').textContent=name||'';
  if(name)highlight(name);else for(const k in sprites)sprites[k].classList.remove('talk');
  logArr.push({name,text});
  await typeLine(text,kind);await waitTap();
}
async function toast(t,ms=2400){const el=$('toast');el.textContent=t;el.classList.add('on');SFX.play('void');await wait(ms);el.classList.remove('on');await wait(400)}
async function showCard(act,ttl){$('cardAct').textContent=act;$('cardTtl').textContent=ttl;$('vn').style.display='none';$('card').classList.add('on');await wait(2300);hideAll();$('card').classList.remove('on');await wait(700)}
async function doFx(f){
  if(f==='shake'){stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');SFX.play('heavy')}
  if(f==='flash'){stage.classList.remove('flash');void stage.offsetWidth;stage.classList.add('flash');stage.classList.add('shake');SFX.play('heavy');setTimeout(()=>stage.classList.remove('flash','shake'),700)}
  if(f==='void'){SFX.play('void');const e=$('eye');e.classList.add('on');await wait(1500);e.classList.remove('on');await wait(300)}
  if(f==='beat'){stage.classList.remove('beat');void stage.offsetWidth;stage.classList.add('beat');SFX.play('hurt');setTimeout(()=>stage.classList.remove('beat'),2300)}
}
function choose(q,opts){return new Promise(res=>{const c=$('choice');c.innerHTML=`<div class="q">${q.replace(/\n/g,'<br>')}</div>`;
  for(const o of opts){const b=document.createElement('button');b.className='opt';b.innerHTML=`<img src="${o.img}" alt=""><div><b>${o.t}</b><span>${o.d}</span></div>`;
    b.onclick=()=>{SFX.play('void');c.classList.remove('on');res(o.k)};c.appendChild(b)}c.classList.add('on')})}

function nameOf(who){return who==='대행자'?G.edenName:who}
function save(){store.set('as0_save',{...G})}

async function runCmd(c){
  if(c.if){if(c.if===G.partner)for(const x of c.c)await runCmd(x);return}
  if('n' in c)return say('',c.n,'narr');
  if('s' in c){const who=c.s==='대행자'?G.edenName:c.s;return say(who,c.t)}
  if(c.bg){setBg(c.bg,c);return}
  if(c.show){showSpr(c.show,c.pos);return}
  if(c.hide){hideSpr(c.hide);return}
  if(c.fx)return doFx(c.fx);
  if(c.sys){$('vn').style.display='block';$('name').textContent='';logArr.push({name:'시스템',text:c.sys});await typeLine(c.sys,'sys');SFX.play('void');return waitTap()}
  if(c.card)return showCard(c.card[0],c.card[1]);
  if(c.choice){G.partner=await choose(c.choice,c.opts);return}
  if(c.setName){G.edenName=c.setName;return}
  if(c.flag){G.flags[c.flag]=1;if(c.flag==='teror')G.absorbed++;return}
  if(c.save){save();return}
  if(c.battle){save();$('vn').style.display='none';hideAll();const keepBg=$('bg').className;
    await Action.run(c.battle,{partner:G.partner,flags:G.flags,name:G.edenName,onLose:()=>G.losses++});
    $('bg').className=keepBg;$('vn').style.display='block';return}
  if(c.end){G.absorbed=Math.max(G.absorbed,2);store.del('as0_save');return showEnd()}
}
async function play(from){G.i=from;
  while(G.i<SCRIPT.length){const c=SCRIPT[G.i];await runCmd(c);G.i++;}
}

/* ═══════════ 전투 ═══════════ */
/* ═══════════ 전투 중 대사 ═══════════ */
window.VN={async say(n,t){const vn=$('vn');vn.style.display='block';vn.style.zIndex=40;await say(n,t,n?'':'narr');vn.style.zIndex='';vn.style.display='none'}};

/* ═══════════ 엔딩 ═══════════ */
function showEnd(){$('vn').style.display='none';$('hud').style.display='none';
  $('endStats').innerHTML=`<dt>함께한 시너지아</dt><dd>${G.partner==='A'?'센티아 (이성)':'센수스 (본성)'} → 합일</dd><dt>계승한 사념</dt><dd>테로르, 포비아</dd><dt>쓰러진 횟수</dt><dd>${G.losses}</dd>`;
  $('end').classList.add('on');return new Promise(()=>{})}
$('endBtn').onclick=()=>location.reload();

/* ═══════════ 타이틀 / HUD ═══════════ */
function startFrom(i){$('title').style.display='none';$('hud').style.display='flex';SFX.play('void');play(i)}
const sv=store.get('as0_save');$('tCont').disabled=!sv;
$('tNew').onclick=()=>{store.del('as0_save');G={i:0,partner:'A',edenName:'대행자',flags:{},losses:0,absorbed:0};startFrom(0)};
$('tCont').onclick=()=>{const s=store.get('as0_save');if(!s)return;G=s;
  // 저장 위치 직전의 배경을 복원
  let b='black';for(let k=0;k<=s.i;k++)if(SCRIPT[k].bg)b=SCRIPT[k].bg;setBg(b);startFrom(s.i)};
$('hud').style.display='none';
$('bAuto').onclick=e=>{e.stopPropagation();auto=!auto;$('bAuto').classList.toggle('on',auto);if(auto&&advanceResolve&&!typing){const r=advanceResolve;advanceResolve=null;r()}};
$('bSnd').onclick=e=>{e.stopPropagation();SFX.on=!SFX.on;$('bSnd').textContent=SFX.on?'소리 켬':'소리 끔'};
$('bLog').onclick=e=>{e.stopPropagation();$('logList').innerHTML=logArr.slice(-80).map(l=>`<p>${l.name?`<b>${l.name}</b>`:''}${l.text.replace(/\n/g,'<br>')}</p>`).join('');$('log').classList.add('on');$('log').scrollTop=1e6};
$('logClose').onclick=()=>$('log').classList.remove('on');
$('bMenu').onclick=e=>{e.stopPropagation();location.reload()};
</script>
</body>
